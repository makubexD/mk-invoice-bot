# Keyword-anchored regexes for the OCR parser (spec 03 §5 step 4, S3.6, R-2.10, R-2.14).
# Every pattern is compiled with re.IGNORECASE and searched in the OCR text, one OCR line per text line.
# A pattern's named group carries the value.
ruc:   # in order: keyword-anchored first, then a bare 11-digit RUC
  - 'R\.?\s?U\.?\s?C\.?\s*[:.]?\s*(?:N[°º.]?\s*)?(?P<value>\d{11})(?!\d)'
  - '(?<!\d)(?P<value>(?:10|15|17|20)\d{9})(?!\d)'
tipo:
  "01": ['FACTURA\s+(?:DE\s+VENTA\s+)?ELECTR[OÓ0]NICA']
  "03": ['BOLETA\s+(?:DE\s+VENTA\s+)?ELECTR[OÓ0]NICA']
serie_numero: '(?<![A-Z0-9])(?P<serie>[FBE][A-Z0-9]{3}|\d{4})\s*[-–—]\s*(?P<numero>\d{1,8})(?!\d)'
date: '(?<!\d)(?P<value>\d{2}[/-]\d{2}[/-]\d{4}|\d{4}-\d{2}-\d{2})(?!\d)'
amount_gap: '[^\d\n]{0,25}'
amount_value: 'S?/?\.?\s*(?P<value>\d{1,3}(?:[.,\s]\d{3})*[.,]\d{2}|\d+[.,]\d{2})(?!\d)'
amounts:   # field -> keywords; the first keyword (in list order) with a match wins
  total:
    - 'IMPORTE\s+TOTAL'
    - 'TOTAL\s+A\s+PAGAR'
    - 'TOTAL\s+VENTA'
    - '(?<!SUB)(?<!SUB\s)\bTOTAL\b(?!\s*(?:GRAVAD|IGV|DESC|EXONER|INAFEC))'
  base: ['OP\.?\s*GRAVADAS?']
  igv: ['\bI\.?G\.?V\.?\b']
  service_charge: ['RECARGO', 'SERVICIO']
  icbper: ['ICBPER']
  discounts: ['DESCUENTOS?']
printed_url: '(?P<value>https?://[^\s<>"]+)'
