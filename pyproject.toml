[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mk-invoice-bot"
version = "0.1.0"
description = "Invoice processing bot"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "PyYAML>=6.0.2",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "alembic>=1.14",
    "sqlalchemy>=2.0",
    "pyrage>=1.2",
    "httpx>=0.28",
    "zxing-cpp==3.1.1",
    "opencv-python-headless==5.0.0.93",
    "lxml==6.1.3",
    "playwright==1.64.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0.12",
    "import-linter>=2.0",
    "bandit>=1.8",
    "pip-audit>=2.7",
    "pytest-cov>=6.0",
    "pytest-timeout>=2.4",
    "types-lxml==2026.2.16",
]

[tool.hatch.build.targets.wheel]
packages = ["src/invoicebot"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
# The lint set is the enforced part of CLAUDE.md "Design rules": naming (N),
# simpler code (SIM, RET, C4, PIE), size and complexity limits (C90, PLR09),
# unused arguments (ARG), dead code (ERA), no print (T20), no private access
# across modules (SLF), imports at module top (PLC0415), pytest style (PT).
select = [
    "E", "F", "I", "B", "UP", "S", "ASYNC",
    "N", "SIM", "RET", "C4", "PIE", "A",
    "C90", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLC0415",
    "ARG", "ERA", "T20", "SLF", "PTH", "DTZ", "PT", "TID252", "RUF",
]
ignore = [
    "N818",   # exception names state the failure (SecretMissing); no forced Error suffix
    "RUF001", # es-PE chat messages use typographic characters on purpose
    "PT012",  # a rollback test needs the whole `async with` block inside pytest.raises
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ARG", "SLF001"]
"scripts/**" = ["T201"] # command-line tools print for the person running them

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
timeout = 60 # a hung LISTEN/NOTIFY or pool wait fails the test instead of the run

[tool.coverage.run]
source = ["src/invoicebot"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
