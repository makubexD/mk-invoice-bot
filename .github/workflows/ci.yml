name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, type-check and test
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: invoicebot
          POSTGRES_PASSWORD: invoicebot
          POSTGRES_DB: invoicebot
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://invoicebot:invoicebot@localhost:5432/invoicebot_test
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check src tests scripts migrations

      - name: Ruff format
        run: uv run ruff format --check src tests scripts migrations

      - name: Mypy
        run: uv run mypy src

      - name: Lint imports
        run: uv run lint-imports

      - name: Install Tesseract
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
          tesseract --version
          tesseract --list-langs | grep -qx spa

      - name: Install Chromium headless shell
        run: uv run playwright install --only-shell --with-deps chromium

      - name: Pytest
        run: uv run pytest -q --cov --cov-fail-under=90

      # R-11.6: a todo/broken portal fails only the pull request that adds or changes its file.
      - name: Check config (pull request)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff --name-only "origin/${BASE_REF}...HEAD" -- config/portals > "$RUNNER_TEMP/changed.txt"
          xargs -a "$RUNNER_TEMP/changed.txt" -d '\n' uv run python scripts/check_config.py --pr

      - name: Check config
        if: github.event_name != 'pull_request'
        run: uv run python scripts/check_config.py

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Audit dependencies
        run: uv run pip-audit

      - name: Bandit
        run: uv run bandit -r src -q

      - name: Guard workflow triggers and runners
        run: |
          trigger="pull_request""_target"
          runner="self-""hosted"
          if grep -RInE "${trigger}|${runner}" .github/workflows; then
            echo "::error::workflows must not use the forbidden trigger or runner"
            exit 1
          fi

      - name: Check fixtures
        run: uv run python scripts/check_fixtures.py

  schema-compat:
    name: Schema compatibility (expand/contract)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: invoicebot
          POSTGRES_PASSWORD: invoicebot
          POSTGRES_DB: invoicebot
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://invoicebot:invoicebot@localhost:5432/invoicebot
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find previous main
        id: prev
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            base="HEAD^"
          else
            base="origin/main"
          fi
          sha="$(git rev-parse --verify --quiet "$base^{commit}" || true)"
          if [[ -z "$sha" ]]; then
            echo "::notice::previous main does not resolve; skipping schema compatibility"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$sha" == "$(git rev-parse HEAD)" ]]; then
            echo "::notice::previous main is HEAD; skipping schema compatibility"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "$sha:deploy/Dockerfile" 2>/dev/null; then
            echo "::notice::previous main has no deploy/Dockerfile; skipping schema compatibility"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Build previous main image
        if: steps.prev.outputs.skip != 'true'
        env:
          PREV_SHA: ${{ steps.prev.outputs.sha }}
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/prev" "$PREV_SHA"
          docker build -f "$RUNNER_TEMP/prev/deploy/Dockerfile" -t localhost/invoicebot-app:prev "$RUNNER_TEMP/prev"

      - name: Install uv
        if: steps.prev.outputs.skip != 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Sync dependencies
        if: steps.prev.outputs.skip != 'true'
        run: |
          set -euo pipefail
          uv sync --frozen

      - name: Migrate to the new head
        if: steps.prev.outputs.skip != 'true'
        run: |
          set -euo pipefail
          uv run alembic upgrade head

      - name: Previous image is healthy on the new schema
        if: steps.prev.outputs.skip != 'true'
        run: |
          set -euo pipefail
          docker run -d --name prev-app --network host -e DATABASE_URL localhost/invoicebot-app:prev
          deadline=$((SECONDS + 60))
          while ((SECONDS < deadline)); do
            code="$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:8080/health || true)"
            if [[ "$code" == "200" ]]; then
              echo "previous main image is healthy on the new schema"
              exit 0
            fi
            sleep 2
          done
          docker logs prev-app || true
          echo "::error::previous main image is not healthy against the new schema head"
          exit 1
