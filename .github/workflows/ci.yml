name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, type-check and test
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: invoicebot
          POSTGRES_PASSWORD: invoicebot
          POSTGRES_DB: invoicebot
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://invoicebot:invoicebot@localhost:5432/invoicebot_test
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check src tests scripts migrations

      - name: Ruff format
        run: uv run ruff format --check src tests scripts migrations

      - name: Mypy
        run: uv run mypy src

      - name: Pytest
        run: uv run pytest -q

      - name: Check config (pull request)
        if: github.event_name == 'pull_request'
        run: uv run python scripts/check_config.py --pr

      - name: Check config
        if: github.event_name != 'pull_request'
        run: uv run python scripts/check_config.py

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Audit dependencies
        run: uv run pip-audit

      - name: Bandit
        run: uv run bandit -r src -q

      - name: Guard workflow triggers and runners
        run: |
          trigger="pull_request""_target"
          runner="self-""hosted"
          if grep -RInE "${trigger}|${runner}" .github/workflows; then
            echo "::error::workflows must not use the forbidden trigger or runner"
            exit 1
          fi

      - name: Check fixtures
        run: uv run python scripts/check_fixtures.py
